<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" aria-labelledby="title desc" role="img" viewBox="0 0 1500 640"><title id="title">Milvus CDC replication architecture</title><desc id="desc">CDC nodes in a source cluster consume messages from source streaming nodes and replicate them to target proxies. Target proxies write DDL, DCL, and DML messages to target streaming nodes, which append them to WAL.</desc><defs><marker id="arrow-green" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#4d9b63" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-purple" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#8162cc" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#d35d59" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1500" height="640" fill="#fff"/><rect width="690" height="570" x="30" y="35" fill="none" stroke="#7f8b94" stroke-dasharray="6 6" stroke-width="1.8" rx="6"/><text x="40" y="75" fill="#20262d" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Source Cluster</text><rect width="585" height="180" x="85" y="130" fill="#ffd0b2" rx="8"/><text x="95" y="163" fill="#20262d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Streaming Nodes</text><rect width="155" height="72" x="116" y="185" fill="#f7f7f7" rx="7"/><text x="129" y="224" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">Streaming Node</text><rect width="155" height="72" x="300" y="185" fill="#f7f7f7" rx="7"/><text x="313" y="224" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">Streaming Node</text><rect width="155" height="72" x="485" y="185" fill="#f7f7f7" rx="7"/><text x="498" y="224" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">Streaming Node</text><rect width="585" height="180" x="85" y="415" fill="#9fd5b2" rx="8"/><text x="95" y="448" fill="#20262d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">CDC Nodes</text><rect width="155" height="72" x="116" y="470" fill="#f7f7f7" rx="7"/><text x="153" y="512" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">CDC Node</text><rect width="155" height="72" x="300" y="470" fill="#f7f7f7" rx="7"/><text x="337" y="512" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">CDC Node</text><rect width="155" height="72" x="485" y="470" fill="#f7f7f7" rx="7"/><text x="522" y="512" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">CDC Node</text><path fill="none" stroke="#4d9b63" stroke-width="3" marker-end="url(#arrow-green)" d="M 377 412 L 377 325"/><text x="338" y="363" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="18">Consume</text><rect width="580" height="570" x="880" y="35" fill="none" stroke="#7f8b94" stroke-dasharray="6 6" stroke-width="1.8" rx="6"/><text x="890" y="75" fill="#20262d" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Target Cluster</text><rect width="142" height="465" x="935" y="130" fill="#d2daf9" rx="7"/><text x="945" y="163" fill="#20262d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Proxy</text><rect width="100" height="46" x="956" y="185" fill="#f7f7f7" rx="7"/><text x="983" y="216" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">Proxy</text><rect width="100" height="46" x="956" y="286" fill="#f7f7f7" rx="7"/><text x="983" y="317" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">Proxy</text><rect width="100" height="46" x="956" y="392" fill="#f7f7f7" rx="7"/><text x="983" y="423" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">Proxy</text><rect width="100" height="46" x="956" y="500" fill="#f7f7f7" rx="7"/><text x="983" y="531" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">Proxy</text><rect width="215" height="155" x="1200" y="130" fill="#ffd0b2" rx="7"/><text x="1215" y="217" fill="#20262d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Streaming Nodes</text><rect width="215" height="150" x="1200" y="445" fill="#8ebcf0" rx="7"/><text x="1285" y="525" fill="#20262d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">WAL</text><path fill="none" stroke="#4d9b63" stroke-width="3" marker-end="url(#arrow-green)" d="M 672 505 H 795 Q 797 505 797 503 V 212 Q 797 210 799 210 H 930"/><text x="760" y="306" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">Replicate</text><path fill="none" stroke="#8162cc" stroke-width="3" marker-end="url(#arrow-purple)" d="M 1080 365 H 1125 Q 1140 365 1140 350 V 217 Q 1140 208 1149 208 H 1195"/><text x="1082" y="305" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">DDL/DCL/DML</text><path fill="none" stroke="#d35d59" stroke-width="3" marker-end="url(#arrow-red)" d="M 1308 290 V 430"/><text x="1275" y="376" fill="#2b3036" font-family="Arial, Helvetica, sans-serif" font-size="19">Append</text></svg>